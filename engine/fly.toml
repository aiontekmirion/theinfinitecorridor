# fly.toml app configuration file generated for theinfinitecorridor on 2026-10-25T04:07:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'theinfinitecorridor'
primary_region = 'ams'

[build]
[env]
  PORT = '8787'

[[mounts]]
  source = 'room_data'
  destination = '/app/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
